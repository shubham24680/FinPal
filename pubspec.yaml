name: finpal
description: "A Finance app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Identifiers
  uuid: ^4.5.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Routing
  go_router: ^17.0.0

  # Responsive
  flutter_screenutil: ^5.9.3

  # Images
  flutter_svg: ^2.2.2

  # Utils
  intl: ^0.20.2
  fl_chart: ^0.66.0
  flutter_native_splash: ^2.4.6 
  url_launcher: ^6.3.2 # Switch to method channel
  smooth_page_indicator: ^1.2.1 # Change this to custom package
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  package_info_plus: ^9.0.1

flutter_native_splash:
  android: true
  ios: true
  color: "#ffffff"
  image: assets/res/logo_512.png
  android_12:
    color: "#ffffff"
    image: assets/res/logo_1024.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/svgs/
    - assets/svgs/expense_category/
    - assets/svgs/income_category/
    - assets/svgs/payment_method/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/light.ttf
          weight: 300
        - asset: assets/fonts/poppins/regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/semibold.ttf
          weight: 600
        - asset: assets/fonts/poppins/bold.ttf
          weight: 700
