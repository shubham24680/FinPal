name: finpal
description: "A Finance app."
publish_to: "none"
version: 1.0.4+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Services
  dio: ^5.9.2
  google_generative_ai: ^0.4.7

  # Authentication & Security
  local_auth: ^2.3.0
  crypto: ^3.0.7
  uuid: ^4.5.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1

  # Routing
  go_router: ^17.0.0

  # Responsive
  flutter_screenutil: ^5.9.3

  # Images & Animations
  lottie: ^3.3.0
  flutter_svg: ^2.2.2

  # Utils
  intl: ^0.20.2
  fl_chart: ^0.66.0
  flutter_native_splash: ^2.4.6 
  url_launcher: ^6.3.2 # Switch to method channel
  smooth_page_indicator: ^1.2.1 # Change this to custom package
  flutter_markdown_plus: ^1.0.7
  shimmer: ^3.0.0

flutter_native_splash:
  android: true
  ios: true

  color: "#BF7EE"
  image: assets/res/splash.png

  android_12:
    color: "#BF7EE"
    image: assets/res/splash_12.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/svgs/
    - assets/lotties/
    - assets/res/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/light.ttf
          weight: 300
        - asset: assets/fonts/poppins/regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/semibold.ttf
          weight: 600
        - asset: assets/fonts/poppins/bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/thin.ttf
          weight: 100
        - asset: assets/fonts/inter/light.ttf
          weight: 300
        - asset: assets/fonts/inter/regular.ttf
          weight: 400
        - asset: assets/fonts/inter/medium.ttf
          weight: 500
        - asset: assets/fonts/inter/semibold.ttf
          weight: 600
        - asset: assets/fonts/inter/bold.ttf
          weight: 700
